[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcpmonitor"
version = "0.1.0"
description = "MCP server giving AI agents log access and controlled Docker restart/update control via Dockhand"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "mcp>=2.2,<3",
    "httpx>=0.27",
    "uptime-kuma-api2>=2.9,<3",
    "apprise>=1.9,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
mcpmonitor = "mcpmonitor.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcpmonitor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
anyio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # line length is the formatter's job; long SQL/regex/HTML strings are fine
